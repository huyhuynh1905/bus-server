<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Company</title>
    <link rel="stylesheet" href="/company/css/style.css">
</head>
<body>
<div class="container">
    <h2>Đăng ký Công ty</h2>

    <form id="registerForm">
        <div class="form-row">
            <div class="form-group">
                <label for="name">Tên công ty:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="systemCode">Mã hệ thống:</label>
                <input type="text" id="systemCode" name="systemCode">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="address">Địa chỉ:</label>
                <input type="text" id="address" name="address">
            </div>
            <div class="form-group">
                <label for="phoneNumber">Số điện thoại:</label>
                <input type="tel" id="phoneNumber" name="phoneNumber">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="description">Mô tả:</label>
                <input type="text" id="description" name="description">
            </div>
            <div class="form-group">
                <label for="systemName">Tên hệ thống:</label>
                <input type="text" id="systemName" name="systemName">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="logoFileName">Tên logo:</label>
                <input type="text" id="logoFileName" name="logoFileName">
            </div>
            <div class="form-group">
                <label for="logoMiniRepoId">Logo Mini Repo ID:</label>
                <input type="number" id="logoMiniRepoId" name="logoMiniRepoId">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="website">Website:</label>
                <input type="url" id="website" name="website">
            </div>
            <div class="form-group">
                <label for="overview">Tổng quan:</label>
                <input type="text" id="overview" name="overview">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="companyUrl">URL công ty:</label>
                <input type="url" id="companyUrl" name="companyUrl">
            </div>
            <div class="form-group">
                <label for="deputy">Đại diện:</label>
                <input type="text" id="deputy" name="deputy">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
            </div>
            <div class="form-group">
                <label for="taxCode">Mã số thuế:</label>
                <input type="text" id="taxCode" name="taxCode">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="city">Thành phố:</label>
                <input type="text" id="city" name="city">
            </div>
        </div>

        <button type="submit">Đăng ký</button>
    </form>

    <button id="createAccountButton">Tạo Tài khoản</button>
</div>

<script src="/company/js/script.js"></script>

</body>
</html>
